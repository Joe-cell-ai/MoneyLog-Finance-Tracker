name: Backend TypeScript check

on:
  push:
    branches: [main, master]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install backend dependencies
        working-directory: functions
        run: npm install
      - name: Type-check backend
        working-directory: functions
        run: npm run check
