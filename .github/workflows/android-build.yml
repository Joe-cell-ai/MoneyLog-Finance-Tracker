name: MoneyLog Android build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      MONEYLOG_KEYSTORE_BASE64: ${{ secrets.MONEYLOG_KEYSTORE_BASE64 }}
      MONEYLOG_KEYSTORE_PASSWORD: ${{ secrets.MONEYLOG_KEYSTORE_PASSWORD }}
      MONEYLOG_KEY_ALIAS: ${{ secrets.MONEYLOG_KEY_ALIAS }}
      MONEYLOG_KEY_PASSWORD: ${{ secrets.MONEYLOG_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Gradle installation
        run: gradle --version
      - name: Prepare persistent signing key
        if: env.MONEYLOG_KEYSTORE_BASE64 != '' && env.MONEYLOG_KEYSTORE_PASSWORD != '' && env.MONEYLOG_KEY_ALIAS != '' && env.MONEYLOG_KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/moneylog-release.jks"
          printf '%s' "$MONEYLOG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "MONEYLOG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build persistently signed release APK
        if: env.MONEYLOG_KEYSTORE_BASE64 != '' && env.MONEYLOG_KEYSTORE_PASSWORD != '' && env.MONEYLOG_KEY_ALIAS != '' && env.MONEYLOG_KEY_PASSWORD != ''
        run: gradle --no-daemon --stacktrace --warning-mode all assembleRelease
      - name: Build debug APK (fallback when signing secrets are not configured)
        if: env.MONEYLOG_KEYSTORE_BASE64 == '' || env.MONEYLOG_KEYSTORE_PASSWORD == '' || env.MONEYLOG_KEY_ALIAS == '' || env.MONEYLOG_KEY_PASSWORD == ''
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug
      - name: Report release APK
        if: success() && env.MONEYLOG_KEYSTORE_BASE64 != '' && env.MONEYLOG_KEYSTORE_PASSWORD != '' && env.MONEYLOG_KEY_ALIAS != '' && env.MONEYLOG_KEY_PASSWORD != ''
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Upload persistently signed APK
        id: upload_release_apk
        if: success() && env.MONEYLOG_KEYSTORE_BASE64 != '' && env.MONEYLOG_KEYSTORE_PASSWORD != '' && env.MONEYLOG_KEY_ALIAS != '' && env.MONEYLOG_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MoneyLog-android-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
      - name: Report release artifact upload warning
        if: steps.upload_release_apk.outcome == 'failure'
        run: |
          echo "::warning::Release APK was built, but GitHub Actions could not store the artifact. Check Actions and Packages storage quota."
          echo "## APK artifact upload warning" >> "$GITHUB_STEP_SUMMARY"
          echo "The signed release APK built successfully, but GitHub did not store it as an artifact. Check account-level Actions and Packages storage usage; reducing retention does not immediately reset already-accrued monthly usage." >> "$GITHUB_STEP_SUMMARY"
      - name: Report debug APK
        if: success() && (env.MONEYLOG_KEYSTORE_BASE64 == '' || env.MONEYLOG_KEYSTORE_PASSWORD == '' || env.MONEYLOG_KEY_ALIAS == '' || env.MONEYLOG_KEY_PASSWORD == '')
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        id: upload_debug_apk
        if: success() && (env.MONEYLOG_KEYSTORE_BASE64 == '' || env.MONEYLOG_KEYSTORE_PASSWORD == '' || env.MONEYLOG_KEY_ALIAS == '' || env.MONEYLOG_KEY_PASSWORD == '')
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MoneyLog-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Report debug artifact upload warning
        if: steps.upload_debug_apk.outcome == 'failure'
        run: |
          echo "::warning::Debug APK was built, but GitHub Actions could not store the artifact. Check Actions and Packages storage quota."
          echo "## APK artifact upload warning" >> "$GITHUB_STEP_SUMMARY"
          echo "The debug APK built successfully, but GitHub did not store it as an artifact. Check account-level Actions and Packages storage usage; reducing retention does not immediately reset already-accrued monthly usage." >> "$GITHUB_STEP_SUMMARY"
