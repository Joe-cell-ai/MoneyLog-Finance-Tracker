name: Android build

on:
  push:
    branches:
      - feature/cloudflare-ai-backend
      - feature/premium-colourful-ui
  pull_request:
    branches:
      - feature/cloudflare-ai-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Build and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle installation
        run: gradle --version

      - name: Build debug APK (persistent signing when configured)
        env:
          MONEYLOG_KEYSTORE_BASE64: ${{ secrets.MONEYLOG_KEYSTORE_BASE64 }}
          MONEYLOG_KEYSTORE_PASSWORD: ${{ secrets.MONEYLOG_KEYSTORE_PASSWORD }}
          MONEYLOG_KEY_ALIAS: ${{ secrets.MONEYLOG_KEY_ALIAS }}
          MONEYLOG_KEY_PASSWORD: ${{ secrets.MONEYLOG_KEY_PASSWORD }}
        run: |
          if [ -n "$MONEYLOG_KEYSTORE_BASE64" ] && [ -n "$MONEYLOG_KEYSTORE_PASSWORD" ] && [ -n "$MONEYLOG_KEY_ALIAS" ] && [ -n "$MONEYLOG_KEY_PASSWORD" ]; then
            echo "$MONEYLOG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moneylog-release.jks"
            chmod 600 "$RUNNER_TEMP/moneylog-release.jks"
            export MONEYLOG_KEYSTORE_FILE="$RUNNER_TEMP/moneylog-release.jks"
            echo "Building with the configured MoneyLog signing key."
          else
            echo "Signing secrets unavailable; using the standard debug signing key."
          fi
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Report APK output and checksum
        if: success()
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moneylog-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
