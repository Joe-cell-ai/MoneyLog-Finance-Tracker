name: Android build

on:
  push:
    branches:
      - feature/cloudflare-ai-backend
      - feature/premium-colourful-ui
  pull_request:
    branches:
      - feature/cloudflare-ai-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Build and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle installation
        run: gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Report APK output and checksum
        if: success()
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-finance-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
