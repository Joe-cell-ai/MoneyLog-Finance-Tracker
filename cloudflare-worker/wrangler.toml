name = "open-finance-ai-api"
main = "src/index.ts"
compatibility_date = "2026-10-23"

# Configure AUTH_JWKS_URL, AUTH_ISSUER, and AUTH_AUDIENCE as Worker
# environment variables in the Cloudflare dashboard after choosing an
# identity provider. Keep OPENAI_API_KEY as a secret, never a plain variable.

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
