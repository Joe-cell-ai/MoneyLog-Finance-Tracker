name = "open-finance-ai-api"
main = "src/index.ts"
compatibility_date = "2026-10-23"
workers_dev = true

# Create this D1 database and replace the placeholder ID before deployment.
[[d1_databases]]
binding = "DB"
database_name = "open-finance-ai-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Create this private R2 bucket before deployment.
[[r2_buckets]]
binding = "FILES"
bucket_name = "open-finance-ai-files"

# Configure AUTH_JWKS_URL, AUTH_ISSUER, AUTH_AUDIENCE as Worker variables.
# Store OPENAI_API_KEY as a Worker secret; never put it in this file.

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
