name = "open-finance-ai-api"
main = "src/index.ts"
compatibility_date = "2026-10-23"
workers_dev = true

# D1 database for Open Finance AI.
[[d1_databases]]
binding = "DB"
database_name = "open-finance-ai-db"
database_id = "81978b51-3b41-4c8c-8276-58eead8f8743"
migrations_dir = "migrations"

# Private R2 bucket for receipts and bills.
[[r2_buckets]]
binding = "FILES"
bucket_name = "open-finance-ai-files"

# Configure AUTH_JWKS_URL, AUTH_ISSUER, AUTH_AUDIENCE as Worker variables.
# Store OPENAI_API_KEY as a Worker secret; never put it in this file.

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
